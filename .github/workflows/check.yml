name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python tools/tests/test_store.py -v

      - name: Validate every plugin
        run: python tools/store.py validate --all

      - name: Index is up to date
        run: python tools/store.py index --check

      - name: Verify newly-added releases
        run: python tools/store.py verify-release --changed --base "origin/${{ github.base_ref }}"
