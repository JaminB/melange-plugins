; Sandtide petrify: the sand cast that creeps up a cursed worm from its tail to its waist. Each slot is a worm's body centre
; (wormN, world units, 12 above the feet the game reports; 0,0,0 when unused), its petrify level (levelK, a vec4 holding slots
; 4K to 4K+3, 0..1: 0 nothing, 1 the cast reaches the waist), its seed (seedK, the same layout, any value; it picks the worm's
; own grain, cracks and front) and how far the cast has dissolved under water (dissolveK, the same layout, 0..1). Sandtide's
; Lua (client/petrify.lua) drives all of these with wum.postfx.setTransient, so they are hidden. (The vec4 parameters are colours
; because that is how a parameter holds four floats.) It runs after Bloodsand's skin (51), guts (52) and gibs (53) and
; Kindjal's acid (54), so the sand covers blood and acid below the front, and before Sunstone's occlusion (100) and grade (300),
; which then light and grade the sand like the rest of the scene. compat is 1 while Sunstone runs (the skin test allows for its
; tints), tone0..3 and sunskin come from Sunstone's mod.sunstone.skin event, as in Kindjal's acid.
;
; Texture: sand_detail.png is mod/textures/sand_albedo.png (CC0, ambientCG Ground097) reduced to 128x128 by
; tools/make_petrify_tex.py, because an effect may only read files in its own folder and post-FX textures get no mipmaps. It
; adds wind ripples to the close shots; the rest of the look is procedural (3D noise and cells in the worm's own space, so it
; needs no UVs). Set USE_SAND_TEX to 0 at the top of petrify.frag and drop texture.sand below to go procedural only.
[effect]
title=Sandtide petrify
stage=PostWorld
order=55
enabled=0

[param.worm0]
type=vec3
default=0,0,0
label=Worm 0 centre (set by Sandtide)
hidden=1

