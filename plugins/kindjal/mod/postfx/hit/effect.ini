; Hit flash: a brief dark-red vignette and desaturation when a heavy hit lands. p_flash (0..1) and p_center (the victim's
; screen uv) are driven by Kindjal's Lua with wum.postfx.setTransient, so they are hidden; the client enables the effect
; only while a flash is running.
[effect]
title=Kindjal hit flash
stage=Final
order=900
enabled=0

[param.flash]
type=float
default=0
label=Flash amount (set by Kindjal)
hidden=1

[param.center]
type=vec2
default=0.5,0.5
label=Victim on the screen (set by Kindjal)
hidden=1

[pass.hit]
shader=hit.frag
inputs=scene
