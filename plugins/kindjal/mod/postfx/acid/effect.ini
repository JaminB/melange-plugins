; Acid on the worms' skin: each slot is a worm's body centre (wormN, world units, 0,0,0 when unused), its acid level
; (levelK, a vec4 holding slots 4K to 4K+3, 0..1) and how far the eaten pattern has spread (spreadK, the same layout, 0..1).
; The seed is one value for the whole match. Kindjal's Lua drives all of these with wum.postfx.setTransient, so they are
; hidden. (The levelK and spreadK parameters are colours because that is how a parameter holds four floats.) It runs
; after Bloodsand's skin (51), guts (52) and gibs (53) and before Sunstone's occlusion (100) and grade (300), and the client enables
; it only while a worm has acid on it. compat is 1 while Sunstone runs (the skin test then allows for its tints), else 0.
[effect]
title=Kindjal acid
stage=PostWorld
order=54
enabled=0

