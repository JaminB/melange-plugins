; An analytic gradient and sun glow over the game's own sky dome (never a replacement of it). Off in every preset:
; the sun direction is fixed, not the level's own, so it suits only some themes.
[effect]
title=Sky glow
stage=PostWorld
order=150
enabled=0

[param.sunDir]
type=vec3
default=0.35,0.75,0.3
min=-1
max=1
label=Sun direction

[param.sunColor]
type=color
default=1.0,0.85,0.65
label=Sun colour

[param.sunSize]
type=float
default=1.2
min=0.2
max=8
label=Sun size (degrees)

[param.glowSharpness]
type=float
default=64
min=4
max=512
label=Glow sharpness

[param.glowIntensity]
type=float
default=0.6
min=0
max=3
label=Glow intensity

[param.horizonColor]
type=color
default=1.0,0.75,0.5
label=Horizon colour

[param.zenithColor]
type=color
default=0.35,0.45,0.68
label=Zenith colour

[param.gradientStrength]
type=float
default=0.35
min=0
max=1
label=Gradient strength

[pass.sky]
shader=sky.frag
inputs=scene,depth
