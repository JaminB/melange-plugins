; SMAA 1x: morphological anti-aliasing (Jimenez et al.), MIT licence, see LICENSE.txt.
; SMAA.hlsl is the unmodified upstream file; AreaTex.png and SearchTex.png are AreaTex.h and SearchTex.h converted
; to PNG. Source: https://github.com/iryoku/smaa
; Use this instead of the game's /FXAA, not both.
[effect]
title=SMAA anti-aliasing
stage=PostWorld
order=600
enabled=0

[param.threshold]
type=float
default=0.1
min=0.02
max=0.3
label=Edge threshold

[texture.area]
file=AreaTex.png
filter=linear
wrap=clamp

[texture.search]
file=SearchTex.png
filter=nearest
wrap=clamp

[pass.edges]
shader=edges.frag
format=rg8
inputs=scene

[pass.weights]
shader=weights.frag
format=rgba8
inputs=pass.edges,texture.area,texture.search

[pass.blend]
shader=blend.frag
inputs=scene,pass.weights
