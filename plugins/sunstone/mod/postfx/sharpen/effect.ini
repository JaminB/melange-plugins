; AMD FidelityFX Contrast Adaptive Sharpening (sharpen only, no scaling), MIT licence, see LICENSE.txt.
; A GLSL 1.20 port of CasFilter() from ffx_cas.h: https://github.com/GPUOpen-Effects/FidelityFX-CAS
; Sunstone adds a fade near the camera and a floor for faint steps, so magnified textures do not turn blocky.
[effect]
title=Sharpen (AMD CAS)
stage=PostWorld
order=700
enabled=0

[param.sharpness]
type=float
default=0.5
min=0
max=1
label=Sharpness

[param.nearFade]
type=float
default=60
min=0
max=400
label=Sharpening fades in up to this distance (world units)

[param.floor]
type=float
default=0.015
min=0
max=0.1
label=Leave steps fainter than this unsharpened

[pass.cas]
shader=cas.frag
inputs=scene,depth
