; Filmic curve, a two-look colour-grading LUT blend (golden.png and dusk.png, both generated by
; tools/make_luts.py from pure code, never sampled from a game frame) and a radial vignette. Blue, violet and
; purple pixels keep their hue (the LUT fades out on them), so skies, sea and violet themes do not drift grey or pink.
; World grade only: this runs at PostWorld, so the HUD and labels are never tinted. The sky dome keeps its own
; colours (skyGrade), so pale skies do not turn milky or teal; only the vignette reaches it.
[effect]
title=Grade
stage=PostWorld
order=500
enabled=0

[param.exposure]
type=float
default=0
min=-2
max=2
label=Exposure (stops)

[param.strength]
type=float
default=0.6
min=0
max=1
label=Filmic curve

[param.contrast]
type=float
default=1.05
min=0.5
max=1.5
label=Contrast

[param.saturation]
type=float
default=1.1
min=0
max=2
label=Saturation

[param.lutAmount]
type=float
default=0.35
min=0
max=1
label=Grade strength

[param.look]
type=float
default=0
min=0
max=1
label=Look (golden to dusk)

[param.vignette]
type=float
default=0.15
min=0
max=1
label=Vignette

[param.skyGrade]
type=float
default=0
min=0
max=1
label=Grade the sky

[param.huePreserve]
type=float
default=0.85
min=0
max=1
label=Protect blue and purple hues

[texture.golden]
file=golden.png
filter=linear
wrap=clamp

[texture.dusk]
file=dusk.png
filter=linear
wrap=clamp

[pass.grade]
shader=grade.frag
inputs=scene,depth,texture.golden,texture.dusk
