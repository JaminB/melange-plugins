; Filmic curve, a two-look colour-grading LUT blend (golden.png and dusk.png, both generated by
; tools/make_luts.py from pure code, never sampled from a game frame), a radial vignette and fine grain.
; World grade only: this runs at PostWorld, so the HUD and labels are never tinted.
[effect]
title=Grade
stage=PostWorld
order=500
enabled=0

[param.exposure]
type=float
default=0
min=-2
max=2
label=Exposure (stops)

[param.strength]
type=float
default=0.6
min=0
max=1
label=Filmic curve

[param.contrast]
type=float
default=1.05
min=0.5
max=1.5
label=Contrast

[param.saturation]
type=float
default=1.1
min=0
max=2
label=Saturation

[param.lutAmount]
type=float
default=0.6
min=0
max=1
label=Grade strength

[param.look]
type=float
default=0
min=0
max=1
label=Look (golden to dusk)

[param.vignette]
type=float
default=0.25
min=0
max=1
label=Vignette

[param.grain]
type=float
default=0.015
min=0
max=0.1
label=Grain

[texture.golden]
file=golden.png
filter=linear
wrap=clamp

[texture.dusk]
file=dusk.png
filter=linear
wrap=clamp

[pass.grade]
shader=grade.frag
inputs=scene,texture.golden,texture.dusk
