; Lens finish: chromatic aberration toward the screen edges, film grain and a final dither. Grain and dither read a
; 64x64 blue-noise tile (generated by tools/make_textures.py), moved every frame, one cell per window pixel.
[effect]
title=Lens
stage=PostWorld
order=800
enabled=0

[param.ca]
type=float
default=1.2
min=0
max=4
label=Chromatic aberration at the corners (pixels)

[param.grain]
type=float
default=0.009
min=0
max=0.1
label=Film grain

[param.dither]
type=float
default=1
min=0
max=2
label=Dither (output steps)

[texture.bluenoise]
file=bluenoise.png
filter=nearest
wrap=repeat

[pass.lens]
shader=lens.frag
inputs=scene,texture.bluenoise
