; Horizon-based ambient occlusion and sun contact shadows from the depth buffer: soft shading in creases and where
; objects meet the ground, plus short shadows cast toward the sun by small detail. Both are applied in linear light;
; bright surfaces get a multi-bounce lift and sunlit pixels lose part of the AO. Radius and lengths are in world
; units (a worm is about 30 tall). Sky pixels are found by distance (the game's sky dome sits at about 0.6 of the
; far plane) and never sampled or darkened. sunDir is the world direction toward the sun.
[effect]
title=Ambient occlusion and contact shadows
stage=PostWorld
order=100
enabled=0

[param.radius]
type=float
default=32
min=4
max=80
label=Radius

[param.intensity]
type=float
default=1.2
min=0
max=3
label=Intensity

[param.bias]
type=float
default=0.05
min=0
max=0.3
label=Bias

[param.maxDistance]
type=float
default=1500
min=200
max=6000
label=Max distance

[param.nearFade]
type=float
default=80
min=0
max=400
label=Near fade distance

[param.slices]
type=int
default=2
min=1
max=4
label=Directions

[param.steps]
type=int
default=4
min=1
max=8
label=Steps per direction

[param.sunlitFade]
type=float
default=0.5
min=0
max=1
label=Ease AO on sunlit surfaces

[param.contactKeep]
type=float
default=0.5
min=0
max=1
label=Deep occlusion kept on sunlit surfaces

[param.sunDir]
type=vec3
default=0,0.936,-0.351
min=-1
max=1
label=Direction toward the sun (world)

[param.sunAmount]
type=float
default=1
min=0
max=1
label=Sunlight

[param.contactStrength]
type=float
default=0
min=0
max=1
label=Contact shadow strength

[param.contactLength]
type=float
default=26
min=2
max=80
label=Contact shadow length

[param.contactThickness]
type=float
default=10
min=1
max=60
label=Contact shadow thickness

[param.contactSteps]
type=int
default=10
min=4
max=16
label=Contact shadow steps

[param.contactTint]
type=color
default=0.92,0.96,1.0
label=Contact shadow tint

[param.debug]
type=int
default=0
min=0
max=3
label=Debug view (1 AO, 2 contact, 3 both)

[pass.ao]
shader=ao.frag
scale=0.5
format=rgba8
inputs=depth

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.5
format=rgba8
inputs=prev,depth

[pass.blurv]
shader=blur.frag
scale=0.5
format=rgba8
inputs=prev,depth

; AO_SCALE must match the scale of the passes above.
[pass.apply]
shader=apply.frag
defines=AO_SCALE=0.5
inputs=scene,depth,pass.blurv
