; Screen-space ambient occlusion from the depth buffer alone. Fixed versus the mirage-samples sample: a hard sky
; mask up front, a view-distance falloff, edge-aware normals that drop a neighbour rather than reach across the
; horizon, and a bilateral blur that never blends a sky texel into a ground one. That combination is what removed
; the chevron/stripe artefacts the unfixed sample showed over the whole sky.
[effect]
title=Ambient occlusion (SSAO)
stage=PostWorld
order=100
enabled=0

[param.radius]
type=float
default=1
min=0.1
max=10
label=Radius

[param.intensity]
type=float
default=1
min=0
max=3
label=Intensity

[param.bias]
type=float
default=0.05
min=0
max=0.3
label=Bias

[param.maxDistance]
type=float
default=60
min=10
max=300
label=Max distance

[param.taps]
type=int
default=8
min=4
max=16
label=Samples

[param.debug]
type=bool
default=0
label=Show the AO term

[pass.ao]
shader=ao.frag
scale=0.5
format=rgba8
inputs=depth

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.5
format=rgba8
inputs=prev,depth

[pass.blurv]
shader=blur.frag
scale=0.5
format=rgba8
inputs=prev,depth

[pass.apply]
shader=apply.frag
inputs=scene,pass.blurv
