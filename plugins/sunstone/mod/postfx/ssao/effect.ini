; Screen-space ambient occlusion from the depth buffer: contact shadows where objects meet the ground and in creases.
; Radius and distances are in world units (a worm is about 30 tall). Sky pixels are found by distance (the game's
; sky dome sits at about 0.6 of the far plane) and never sampled or darkened.
[effect]
title=Ambient occlusion (SSAO)
stage=PostWorld
order=100
enabled=0

[param.radius]
type=float
default=16
min=2
max=60
label=Radius

[param.intensity]
type=float
default=1.5
min=0
max=3
label=Intensity

[param.bias]
type=float
default=0.1
min=0
max=0.3
label=Bias

[param.maxDistance]
type=float
default=1500
min=200
max=6000
label=Max distance

[param.taps]
type=int
default=10
min=4
max=16
label=Samples

[param.debug]
type=bool
default=0
label=Show the AO term

[pass.ao]
shader=ao.frag
scale=0.5
format=rgba8
inputs=depth

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.5
format=rgba8
inputs=prev,depth

[pass.blurv]
shader=blur.frag
scale=0.5
format=rgba8
inputs=prev,depth

[pass.apply]
shader=apply.frag
inputs=scene,pass.blurv
