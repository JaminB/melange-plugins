; Bloom: highlights (sun glints on water, explosions, specular hits) glow softly. A quarter-resolution soft-knee
; bright-pass over a 4x4 box, a separable blur, then a screen blend, so nothing clips. The sky counts for less, so
; white clouds don't haze the whole sky.
[effect]
title=Bloom
stage=PostWorld
order=300
enabled=0

[param.threshold]
type=float
default=0.85
min=0.3
max=1
label=Threshold

[param.intensity]
type=float
default=1.2
min=0
max=2
label=Intensity

[param.radius]
type=float
default=1.5
min=0.5
max=4
label=Radius

[param.skyWeight]
type=float
default=0.2
min=0
max=1
label=Sky contribution

[pass.extract]
shader=extract.frag
scale=0.25
format=rgba16f
inputs=scene,depth

[pass.blurh]
shader=blur.frag
defines=HORIZONTAL=1
scale=0.25
format=rgba16f
inputs=prev

[pass.blurv]
shader=blur.frag
scale=0.25
format=rgba16f
inputs=prev

[pass.blurh2]
shader=blur.frag
defines=HORIZONTAL=1,WIDE=1
scale=0.25
format=rgba16f
inputs=prev

[pass.blurv2]
shader=blur.frag
defines=WIDE=1
scale=0.25
format=rgba16f
inputs=prev

[pass.combine]
shader=combine.frag
inputs=scene,pass.blurv,pass.blurv2
