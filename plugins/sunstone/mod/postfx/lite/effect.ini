; A single-pass light and grade for slower machines: the green-band control for foliage, highlights expanded back
; toward their real range, exposure, vignette, a hue-preserving display transform with a path to white, saturation
; and a dither. Sky pixels are found by distance.
[effect]
title=Light and grade (lite)
stage=PostWorld
order=300
enabled=0

[param.foliage]
type=float
default=0.7
min=0
max=1
label=Natural foliage greens

[param.folShift]
type=float
default=20
min=0
max=40
label=Foliage hue shift toward yellow (degrees)

[param.folValue]
type=float
default=0.1
min=0
max=0.3
label=Foliage darkening

[param.expandSurface]
type=float
default=2
min=1
max=4
label=Highlight range (surfaces)

[param.expandSpec]
type=float
default=6
min=0
max=10
label=Highlight range (white glints)

[param.expandSky]
type=float
default=4
min=1
max=8
label=Highlight range (sky)

[param.exposure]
type=float
default=0.3
min=-2
max=2
label=Exposure (stops)

[param.vignette]
type=float
default=0.12
min=0
max=1
label=Vignette

[param.tsContrast]
type=float
default=1.1
min=0.8
max=1.6
label=Contrast

[param.tsShoulder]
type=float
default=0.98
min=0.85
max=1.15
label=Highlight shoulder

[param.whitePoint]
type=float
default=4
min=1.5
max=16
label=White point

[param.whiteStart]
type=float
default=0.55
min=0
max=0.95
label=Highlights turn white from

[param.whiteAmount]
type=float
default=0.75
min=0
max=1
label=Highlights turn white

[param.saturation]
type=float
default=1
min=0
max=2
label=Saturation

[param.vibrance]
type=float
default=0.1
min=0
max=1
label=Vibrance (muted colours)

[param.skyGrade]
type=float
default=0.25
min=0
max=1
label=Grade the sky

[param.dither]
type=float
default=1
min=0
max=2
label=Dither (8-bit steps)

[pass.lite]
shader=lite.frag
inputs=scene,depth
