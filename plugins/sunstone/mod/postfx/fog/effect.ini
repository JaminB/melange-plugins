[effect]
title=Fog and aerial perspective
stage=PostWorld
order=180
enabled=0

[param.density]
type=float
default=0.012
min=0
max=0.1
label=Distance density

[param.fogHeight]
type=float
default=0
min=-50
max=200
label=Reference height

[param.heightFalloff]
type=float
default=0.05
min=0
max=1
