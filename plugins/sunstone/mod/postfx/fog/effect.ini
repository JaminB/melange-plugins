; Aerial perspective: distant world geometry fades a little toward the colour of the sky at the horizon and loses
; some saturation. The horizon colour is read from the game's own sky every frame, so it follows each theme; the sky
; dome itself is left untouched. Distances are in world units (a worm is about 30 tall, the sky dome about 9400 away).
[effect]
title=Aerial perspective
stage=PostWorld
order=180
enabled=0

[param.distance]
type=float
default=14000
min=2000
max=60000
label=Haze distance

[param.heightFalloff]
type=float
default=1200
min=100
max=10000
label=Haze height

[param.maxHaze]
type=float
default=0.45
min=0
max=0.8
label=Max haze

[param.desaturate]
type=float
default=0.35
min=0
max=1
label=Distance desaturation

[pass.horizon]
shader=horizon.frag
scale=0.03
format=rgba8
inputs=scene,depth

[pass.fog]
shader=fog.frag
inputs=scene,depth,pass.horizon
