; Generated by tools/make_variants.py from the effect without the _u suffix; do not edit.
; The world in linear light: a green-band control for foliage, highlights expanded back toward their real range,
; drifting cloud shadows, height fog toward the colour of the game's own sky at the horizon (warmer toward the sun), a
; soft gradient and sun glow over the sky dome, distance blur, local contrast, light shafts, bloom, lens dirt and a
; faint flare, then exposure, vignette and a hue-preserving display transform with a path to white, saturation, a
; colour-grading LUT (golden.png and dusk.png, generated by tools/make_luts.py) and a blue-noise dither. Distances are
; in world units (a worm is about 30 tall, the sky dome about 9400 away). Sky pixels are found by distance. sunDir is
; the world direction toward the sun.
