[pass.horizon]
shader=horizon.frag
defines=SCALE_HALVED
scale=0.015
format=rgba8
inputs=scene,depth

; Linear HDR colour; alpha is the distance-blur amount. Add defines=DEBUG_RAMP=1 here and on the composite pass to
; replace the bottom of the screen with test ramps.
[pass.lin]
shader=lin.frag
defines=SCALE_HALVED
format=rgba16f
inputs=scene,depth,pass.horizon,texture.cloud

; Bloom chain: d1..d6 halve the resolution each step, u5..u1 add each level back on the way up. Each pass names its
; source sampler with SRC.
[pass.d1]
shader=down.frag
scale=0.25
format=rgba16f
defines=SRC=mg_pass_lin,KARIS,SCALE_HALVED
inputs=pass.lin

; Distance blur at half resolution.
[pass.dofpre]
shader=dofpre.frag
defines=SCALE_HALVED
scale=0.25
format=rgba16f
inputs=pass.lin

[pass.dofblur]
shader=dofblur.frag
defines=SCALE_HALVED
scale=0.25
format=rgba16f
inputs=prev

[pass.d2]
shader=down.frag
scale=0.125
format=rgba16f
defines=SRC=mg_pass_d1,SCALE_HALVED
inputs=pass.d1

[pass.d3]
shader=down.frag
scale=0.0625
format=rgba16f
defines=SRC=mg_prev,SCALE_HALVED
inputs=prev

[pass.d4]
shader=down.frag
scale=0.03125
format=rgba16f
defines=SRC=mg_prev,SCALE_HALVED
inputs=prev

[pass.d5]
shader=down.frag
scale=0.015625
format=rgba16f
defines=SRC=mg_prev,SCALE_HALVED
inputs=prev

[pass.d6]
shader=down.frag
scale=0.0078125
format=rgba16f
defines=SRC=mg_prev,SCALE_HALVED
inputs=prev

[pass.u5]
shader=up.frag
scale=0.015625
format=rgba16f
defines=SRC=mg_pass_d5,LEVEL=5.0,FIRST,SCALE_HALVED
inputs=prev,pass.d5

[pass.u4]
shader=up.frag
scale=0.03125
format=rgba16f
defines=SRC=mg_pass_d4,LEVEL=4.0,SCALE_HALVED
inputs=prev,pass.d4

[pass.u3]
shader=up.frag
scale=0.0625
format=rgba16f
defines=SRC=mg_pass_d3,LEVEL=3.0,SCALE_HALVED
inputs=prev,pass.d3

[pass.u2]
shader=up.frag
scale=0.125
format=rgba16f
defines=SRC=mg_pass_d2,LEVEL=2.0,SCALE_HALVED
inputs=prev,pass.d2

[pass.u1]
shader=up.frag
scale=0.25
format=rgba16f
defines=SRC=mg_pass_d1,LEVEL=1.0,SCALE_HALVED
inputs=prev,pass.d1

; Light shafts at quarter resolution.
[pass.shaftmask]
shader=shaftmask.frag
defines=SCALE_HALVED
scale=0.125
format=rgba16f
inputs=pass.lin,depth,pass.horizon

[pass.shaftA]
shader=shaft.frag
defines=SCALE_HALVED
scale=0.125
format=rgba16f
inputs=prev

[pass.shaftB]
shader=shaft.frag
scale=0.125
format=rgba16f
defines=FINE,SCALE_HALVED
inputs=prev

[pass.composite]
shader=composite.frag
defines=SCALE_HALVED
inputs=pass.lin,pass.dofblur,pass.u1,pass.u2,pass.u3,pass.shaftB,depth,texture.dirt,texture.golden,texture.dusk,texture.bluenoise
