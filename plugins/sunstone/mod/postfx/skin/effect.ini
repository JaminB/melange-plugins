; Human skin on the worms: every pixel of a worm's skin is taken from the game's cartoon peach to a real human skin
; tone, keeping the light the game (and Sunstone's lighting) put on it. Each slot is a worm's body centre (wormN, world
; units, 0,0,0 when unused), its skin albedo (wormNb, display colour 0..1) and its heading, a seed for its own pattern of
; pores and mottling, and how far it moved in the last tick (wormNc). Sunstone's Lua drives all of them with
; wum.postfx.setTransient, so they are hidden; sunDir and compat follow the theme and the lighting setting. The rest are
; the look, with the overlay's sliders.
;
; The same pass also draws the worms' hair (moustaches, and hair hats when the experimental Hair hats setting is on) as
; real hair: skinOn, hair and wigs carry the Worm skin, Hair and Hair hats settings (hidden, set by Sunstone), and each
; worm's natural hair colour for Mixed rides in the thousands of wormNc's seed. hairSheen and hairDetail are its sliders.
;
; Order 55: after Bloodsand's skin (51), guts (52) and gibs (53) and Kindjal's acid (54), so both still find the vanilla
; peach they classify and paint, and before Sunstone's occlusion (100) and grade (300), which then treat the new skin like
; the rest of the scene. The client enables it only in a match with the Worm skin setting on a tone or the Hair setting
; not Game, and Quality not Off.
[effect]
title=Human skin and hair
stage=PostWorld
order=55
enabled=0

