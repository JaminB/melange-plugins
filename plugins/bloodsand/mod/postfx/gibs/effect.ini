; Gibs (meat chunks, bone shards and organs), ray-marched as signed distance fields, for up to 16 at once. Bloodsand's Lua
; throws them, simulates them (flight, bounces, rolling, rest) and sends each one every frame it moves with
; wum.postfx.setTransient, so every parameter but the colour, the opacity and the drying time is hidden. Each slot gk has
; four vec4: gka bounding sphere, gkb orientation, gkc half extents and type, gkd seed, birth, wetness and bloodiness.
; This file and gibs.frag are generated by tools/gen_gibs.js from tools/gibs.frag.in.
[effect]
title=Bloodsand gibs
stage=PostWorld
