; Blood soaked into the ground and anything else near a stain point, projected from the depth buffer so it follows
; the terrain's shape. The eight stain slots are filled by Bloodsand's Lua, which only sends a value when it changes.
; Positions and radii are in world units (a worm is about 30 tall).
[effect]
title=Bloodsand stains
stage=PostWorld
order=50
enabled=0

[param.stain0]
type=vec3
default=0,0,0
label=Stain 0 position (set by Bloodsand)
hidden=1

