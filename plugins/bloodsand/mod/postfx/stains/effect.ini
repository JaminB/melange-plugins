; Blood decals projected from the depth buffer so they follow the terrain: splats and pools on floors, walls and
; overhangs, and the trails of hurt worms (a dotted line of drips and a smear, straight pieces that Bloodsand's Lua
; lengthens as the worm walks), wet and glossy when fresh and drying to dark matte brown. The 32 slots (d0a/d0b ... d31a/d31b, a vec4 pair
; each) are filled by Bloodsand's Lua, which only sends a value when it changes; see stains.frag for the layout. The 16 worm
; params (w0 ... w15) tell the pass where the worms are, so that blood does not land on them.
; Positions and radii are in world units (a worm is about 30 tall).
[effect]
title=Bloodsand stains
stage=PostWorld
order=50
enabled=0

