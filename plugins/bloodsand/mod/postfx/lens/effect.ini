; Blood on the camera lens: the splat shapes, seen through. Where a splat is, the scene is bent (as if by a wet droplet), a little
; blurred, tinted and darkened, with a highlight along the edge and drips running down. It runs before the HUD is drawn, so the
; minimap and the timer stay clear. Bloodsand's Lua sends up to six splats with wum.postfx.setTransient and switches the effect on
; only while there are any; see lens.frag for the layout. If this effect fails, Bloodsand draws the splats flat on the HUD instead.
[effect]
title=Bloodsand lens
stage=PostWorld
order=60
enabled=0

[param.l0a]
type=color
default=0,0,0,0
label=Splat 0 position, size and shape (set by Bloodsand)
hidden=1

[param.l0b]
