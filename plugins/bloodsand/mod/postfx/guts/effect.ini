; Intestines, ray-marched as smooth-unioned tubes along a chain of 16 points per gutted worm, for up to four worms at once.
; Bloodsand's Lua simulates the chain and sends it every frame with wum.postfx.setTransient, so every parameter but the
; colour and the opacity is hidden. Each slot has a header (gka..gkd) and its 16 points gk_0..gk_15 (x, y, z, tube radius).
; This file and guts.frag are generated by tools/gen_guts.js from tools/guts.frag.in.
